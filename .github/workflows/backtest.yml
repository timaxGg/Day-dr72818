# Backtest: tests the bot's rules on real Alpaca data and saves the results in backtest/results.txt.
# Runs on every push to the "backtest" branch, or by hand (Actions > Backtest > Run workflow).
# Needs the repo secrets ALPACA_API_KEY and ALPACA_SECRET_KEY (paper-trading keys are enough).
name: Backtest
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: backtest
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "Add the secrets ALPACA_API_KEY and ALPACA_SECRET_KEY first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          cd backtest && python strategies.py
      - name: Show the results on the run page
        if: always()
        run: |
          if [ -f backtest/strategies_results.txt ]; then
            { echo '```'; cat backtest/strategies_results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save the results in the repo
        if: success()
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add backtest/strategies_results.txt
          git commit -m "Backtest results [skip ci]" || exit 0
          git push
