# Downloads 2023-2025 5-minute history for the stock list and keeps it as a downloadable artifact.
name: History data
on:
  push:
    branches: [backtest]
    paths: [backtest/hist_data.py, .github/workflows/hist.yml]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download history
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: cd backtest && python hist_data.py 2023-01-01 2025-11-30 && tar czf hist.tgz data_hist
      - uses: actions/upload-artifact@v4
        with: { name: hist, path: backtest/hist.tgz, retention-days: 7 }
