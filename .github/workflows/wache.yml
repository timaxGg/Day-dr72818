# Backup-Wache: startet alle 5 Minuten (zwei Zeitpläne als doppelte Absicherung).
# Läuft dein Handy/Server und schreibt frische Daten, beendet sich dieser Lauf sofort wieder.
# Fällt das Handy aus, übernimmt GitHub – während der Börsenzeit durchgehend bis zu 5,5 Stunden am Stück.
name: Wache
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: wache
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gedächtnis laden
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: wache-${{ github.run_id }}
          restore-keys: wache-
      - name: Bot läuft
        env:
          WER: github
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          SYNC_PASSWORD: ${{ secrets.SYNC_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node bot/daytrader.mjs
      - name: Gedächtnis speichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: wache-${{ github.run_id }}
