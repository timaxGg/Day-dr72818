# Playbook test: published day-trading strategies with fixed rules (no tuning).
# Saves backtest/playbook_results.txt.
name: Playbook
on:
  push:
    branches: [backtest]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: playbook
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Download data
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: cd backtest && python search10k.py data
      - name: Run the playbook
        run: cd backtest && python playbook.py
      - name: Show the results on the run page
        run: '{ echo "```"; cat backtest/playbook_results.txt; echo "```"; } >> "$GITHUB_STEP_SUMMARY"'
      - name: Save the results in the repo
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          git add backtest/playbook_results.txt
          git commit -m "Playbook results [skip ci]" || exit 0
          git pull --rebase && git push
